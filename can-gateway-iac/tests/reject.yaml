apiVersion: truefidelity.dev/v1alpha1
kind: Test
metadata:
  name: Receiver rejects malformed requests through the gateway
spec:
  requires:
    ecus: [gateway, receiver, cpp-responder]
    capabilities: [can.capture, can.inject, logs.capture]
  clock: {mode: simulation, maxUncertainty: 0ns, maxSchedulingDelay: 0ns}
  timeout: 100ms
  bindings:
    request: {kind: canFrame, bus: vehicle, frameId: 291, extended: false, observation: bus}
    response: {kind: canFrame, bus: vehicle, frameId: 292, extended: false, observation: {ecu: gateway, direction: tx}}
  setup:
    - id: bus-participants-ready
      expect:
        logs: {ecu: cpp-responder, contains: "C++ responder ready"}
        mode: eventually
        within: 10ms
  steps:
    - id: send-wrong-header
      send: {binding: request, data: [78, 79, 80, 69, 1, 2, 3, 4]}
    - id: no-response-to-wrong-header
      expect:
        binding: response
        mode: never
        for: 10ms
        predicate: {dataMaskedEquals: {value: [0, 0, 0, 0, 0, 0, 0, 0], mask: [0, 0, 0, 0, 0, 0, 0, 0]}}
    - id: send-short-request
      send: {binding: request, data: [80, 73, 78, 71]}
    - id: no-response-to-short-request
      expect:
        binding: response
        mode: never
        for: 10ms
        predicate: {dataMaskedEquals: {value: [0, 0, 0, 0, 0, 0, 0, 0], mask: [0, 0, 0, 0, 0, 0, 0, 0]}}
